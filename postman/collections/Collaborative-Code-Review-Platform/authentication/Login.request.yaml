$kind: http-request
method: POST
url: '{{base_url}}/api/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const response = pm.response.json();
      if (pm.response.code === 200 && response.token) {
          pm.environment.set('access_token', response.token);
          console.log('access_token saved to environment');
      }
